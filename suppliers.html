<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers — MedInventory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">💊</div><span>MedInventory</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a class="nav-item" data-path="/dashboard" href="/dashboard"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item" data-path="/inventory" href="/inventory"><span class="nav-icon">💊</span> Inventory</a>
      <a class="nav-item" data-path="/sales" href="/sales"><span class="nav-icon">🧾</span> Sales & Billing</a>
      <a class="nav-item" data-path="/suppliers" href="/suppliers"><span class="nav-icon">🚚</span> Suppliers</a>
      <div class="nav-section-title" style="margin-top:12px;">Analytics</div>
      <a class="nav-item" data-path="/reports" href="/reports"><span class="nav-icon">📈</span> Reports</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">{{ username[0]|upper }}</div>
        <div class="user-info">
          <div class="user-name">{{ username }}</div>
          <div class="user-role">{{ role|capitalize }}</div>
        </div>
        <button class="btn-logout" onclick="logout()">⏻</button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Supplier Management</span>
      {% if role == 'admin' %}
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Supplier</button>
      </div>
      {% endif %}
    </header>

    <div class="page-body">
      <div class="card">
        <div class="card-header">
          <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Search suppliers…" oninput="loadSuppliers()">
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>#</th><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>GST No.</th><th>Actions</th></tr>
            </thead>
            <tbody id="suppliers-tbody">
              <tr><td colspan="7" style="text-align:center;padding:30px;"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="supplier-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Supplier</span>
      <button class="modal-close" onclick="closeModal('supplier-modal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="sup-id">
      <div class="form-group">
        <label>Supplier Name *</label>
        <input type="text" id="sup-name" class="form-control" placeholder="Company name">
      </div>
      <div class="form-group">
        <label>Contact Person</label>
        <input type="text" id="sup-contact" class="form-control" placeholder="Person name">
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="sup-phone" class="form-control" placeholder="10-digit number">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="sup-email" class="form-control" placeholder="email@example.com">
        </div>
      </div>
      <div class="form-group">
        <label>GST Number</label>
        <input type="text" id="sup-gst" class="form-control" placeholder="e.g. 27AABCP1234A1Z5">
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea id="sup-address" class="form-control" rows="3" placeholder="Full address"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('supplier-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveSupplier()">Save Supplier</button>
    </div>
  </div>
</div>

<!-- View Supplier Modal -->
<div class="modal-overlay" id="view-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="view-title">Supplier Details</span>
      <button class="modal-close" onclick="closeModal('view-modal')">✕</button>
    </div>
    <div class="modal-body" id="view-body"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  const ROLE = '{{ role }}';
  let allSuppliers = [];

  let pager = new Paginator({
    containerId:  'suppliers-tbody',
    paginationId: 'pagination',
    pageSize: 20,
    renderFn: renderRow
  });

  function renderRow(s) {
    const actions = ROLE === 'admin' ? `
      <button class="btn btn-sm btn-outline-primary" onclick="viewSupplier(${s.id})">View</button>
      <button class="btn btn-icon btn-warning" onclick="openEditModal(${s.id})">✏</button>
      <button class="btn btn-icon btn-danger"  onclick="deleteSupplier(${s.id}, '${escapeHtml(s.name)}')">🗑</button>
    ` : `<button class="btn btn-sm btn-outline-primary" onclick="viewSupplier(${s.id})">View</button>`;

    return `<tr>
      <td>${s.id}</td>
      <td><strong>${escapeHtml(s.name)}</strong></td>
      <td>${escapeHtml(s.contact_person || '—')}</td>
      <td>${escapeHtml(s.phone || '—')}</td>
      <td>${escapeHtml(s.email || '—')}</td>
      <td>${escapeHtml(s.gst_number || '—')}</td>
      <td><div class="td-actions">${actions}</div></td>
    </tr>`;
  }

  async function loadSuppliers() {
    const q = document.getElementById('search-input').value.trim();
    try {
      allSuppliers = await API.get('/api/suppliers' + (q ? `?search=${encodeURIComponent(q)}` : ''));
      pager.setData(allSuppliers);
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  function openAddModal() {
    document.getElementById('modal-title').textContent = 'Add Supplier';
    ['sup-id','sup-name','sup-contact','sup-phone','sup-email','sup-gst','sup-address']
      .forEach(id => document.getElementById(id).value = '');
    openModal('supplier-modal');
  }

  async function openEditModal(id) {
    try {
      const s = await API.get(`/api/suppliers/${id}`);
      document.getElementById('modal-title').textContent = 'Edit Supplier';
      document.getElementById('sup-id').value      = s.id;
      document.getElementById('sup-name').value    = s.name;
      document.getElementById('sup-contact').value = s.contact_person || '';
      document.getElementById('sup-phone').value   = s.phone          || '';
      document.getElementById('sup-email').value   = s.email          || '';
      document.getElementById('sup-gst').value     = s.gst_number     || '';
      document.getElementById('sup-address').value = s.address        || '';
      openModal('supplier-modal');
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  async function saveSupplier() {
    const id   = document.getElementById('sup-id').value;
    const name = document.getElementById('sup-name').value.trim();
    if (!name) { showToast('Supplier name is required', 'error'); return; }

    const payload = {
      name,
      contact_person: document.getElementById('sup-contact').value.trim(),
      phone:          document.getElementById('sup-phone').value.trim(),
      email:          document.getElementById('sup-email').value.trim(),
      gst_number:     document.getElementById('sup-gst').value.trim(),
      address:        document.getElementById('sup-address').value.trim()
    };

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    try {
      if (id) {
        await API.put(`/api/suppliers/${id}`, payload);
        showToast('Supplier updated!', 'success');
      } else {
        await API.post('/api/suppliers', payload);
        showToast('Supplier added!', 'success');
      }
      closeModal('supplier-modal');
      loadSuppliers();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteSupplier(id, name) {
    if (!confirm(`Delete supplier "${name}"?`)) return;
    try {
      await API.delete(`/api/suppliers/${id}`);
      showToast('Supplier deleted.', 'success');
      loadSuppliers();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function viewSupplier(id) {
    try {
      const s = await API.get(`/api/suppliers/${id}`);
      document.getElementById('view-title').textContent = s.name;
      const medsHtml = s.medicines.length
        ? s.medicines.map(m => `<tr><td>${escapeHtml(m.name)}</td><td>${m.quantity}</td><td>${formatCurrency(m.price)}</td></tr>`).join('')
        : '<tr><td colspan="3" style="text-align:center; color:#999;">No medicines linked</td></tr>';

      document.getElementById('view-body').innerHTML = `
        <div class="form-grid-2" style="margin-bottom:16px;">
          <div><strong>Contact:</strong> ${escapeHtml(s.contact_person || '—')}</div>
          <div><strong>Phone:</strong> ${escapeHtml(s.phone || '—')}</div>
          <div><strong>Email:</strong> ${escapeHtml(s.email || '—')}</div>
          <div><strong>GST:</strong> ${escapeHtml(s.gst_number || '—')}</div>
        </div>
        <div style="margin-bottom:16px;"><strong>Address:</strong> ${escapeHtml(s.address || '—')}</div>
        <h4 style="margin-bottom:10px;">Medicines from this Supplier</h4>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Medicine</th><th>Qty</th><th>Price</th></tr></thead>
            <tbody>${medsHtml}</tbody>
          </table>
        </div>`;
      openModal('view-modal');
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  loadSuppliers();
</script>
</body>
</html>
